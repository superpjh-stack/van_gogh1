services:
  starry-night:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["node", "/app/server.mjs"]
    user: "1000:1000"
    environment:
      HOST: "0.0.0.0"
      PORT: "8766"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    ports:
      - "8776:8766"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8766/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
