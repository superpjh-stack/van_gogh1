services:
  starry-night:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8766:8766"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
